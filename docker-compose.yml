services:
  postgres:
    image: postgres:16-alpine
    container_name: acadu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acadu
      POSTGRES_PASSWORD: acadu
      POSTGRES_DB: acadu
    ports:
      - "5433:5432"
    volumes:
      - acadu-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acadu -d acadu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acadu-pgdata:
